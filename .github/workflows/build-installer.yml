name: Build Windows installer
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Public URL of your server, e.g. https://api.yourdomain.com"
        required: true
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: choco install innosetup -y
      - run: pip install pyinstaller pystray pillow
      - run: |
          '{"api_url": "${{ inputs.api_url }}"}' | Out-File -Encoding ascii build_config.json
          pyinstaller --onefile --noconsole --clean --name TallySyncAgent --add-data "build_config.json;." agent.py
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with: { name: TallySyncSetup, path: agent/output/TallySyncSetup.exe }
